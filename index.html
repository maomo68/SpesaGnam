    <style>
        :root {
            --bg: #fefdfb;
            --fg: #1a1a1a;
            --muted: #9ca3af;
            --accent: #2ecc71;
            --accent-alt: #e67e22;
            --card: #ffffff;
            --border: #e5e7eb;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg);
            min-height: 100dvh;
            overflow-x: hidden;
        }
        
        /* Background Pattern */
        .bg-pattern {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(46, 204, 113, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(230, 126, 34, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(46, 204, 113, 0.03) 0%, transparent 80%);
        }
        
        /* Floating Food Background */
        .floating-food {
            position: fixed;
            font-size: 2rem;
            opacity: 0.06;
            pointer-events: none;
            animation: floatFood 20s ease-in-out infinite;
            z-index: 0;
        }
        
        @keyframes floatFood {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(20px) rotate(-5deg); }
        }
        
        /* Input Glow */
        .input-glow:focus {
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.2);
        }
        
        /* Item Animations */
        .item-enter {
            animation: itemEnter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        @keyframes itemEnter {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .item-exit {
            animation: itemExit 0.3s ease-out forwards;
        }
        
        @keyframes itemExit {
            to {
                opacity: 0;
                transform: translateX(100px) scale(0.8);
            }
        }
        
        /* Gnam Pop Effect */
        .gnam-pop {
            animation: gnamPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes gnamPop {
            0% { transform: scale(1); }
            30% { transform: scale(1.08); }
            60% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }
        
        /* Emoji Burst */
        .emoji-burst {
            position: fixed;
            pointer-events: none;
            font-size: 1.5rem;
            animation: emojiBurst 0.8s ease-out forwards;
            z-index: 100;
        }
        
        @keyframes emojiBurst {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot));
            }
        }
        
        /* Completed Item */
        .item-completed {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1), rgba(46, 204, 113, 0.05)) !important;
        }
        
        .item-completed .item-text {
            text-decoration: line-through;
            color: var(--muted);
        }
        
        /* Smooth Reorder */
        .list-item {
            transition: all 0.3s ease;
        }
        
        /* Checkbox Custom */
        .checkbox-custom {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid #d1d5db;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent;
        }
        
        .checkbox-custom:hover {
            border-color: var(--accent);
            transform: scale(1.1);
        }
        
        .checkbox-custom.checked {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-color: transparent;
            animation: checkBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes checkBounce {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        /* Mascot Animation */
        .mascot-body {
            animation: mascotBounce 3s ease-in-out infinite;
        }
        
        @keyframes mascotBounce {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        
        .mascot-blink {
            animation: blink 4s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
        
        /* Button Press */
        .btn-press:active {
            transform: scale(0.95);

        /* Stagger Animation */
        .stagger-item {
            animation: staggerIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }
        
        @keyframes staggerIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;

        /* Custom Scrollbar */

            background: rgba(46, 204, 113, 0.5);
        }
        
        /* Focus States */

            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>

    <script>
        // ==================== CONFIG ====================
        const STORAGE_KEY = 'spesagnam_items';
        const foodEmojis = ['🍎', '🍕', '🧀', '🥕', '🍞', '🍇', '🍊', '🥦', '🍗', '🥛', '🍫', '🍌', '🥑', '🍅', '🥚'];
        
        // ==================== STATE ====================
        let items = [];
        
        // ==================== DOM ELEMENTS ====================
        let addForm, itemInput, itemsList, emptyState, statsBar, activeCount, completedCount, clearCompletedBtn, emojiContainer;
        
        // ==================== STORAGE ====================
        function loadItems() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                items = stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.warn('Errore caricamento items:', e);
                items = [];
            }
        }
        
        function saveItems() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            } catch (e) {
                console.warn('Errore salvataggio items:', e);
            }
        }
        
        // ==================== RENDERING ====================
        function getSortedItems() {
            const active = items.filter(i => !i.completed).sort((a, b) => b.createdAt - a.createdAt);
            const completed = items.filter(i => i.completed).sort((a, b) => b.completedAt - a.completedAt);
            return [...active, ...completed];
        }
        
        function updateStats() {
            const active = items.filter(i => !i.completed).length;
            const completed = items.filter(i => i.completed).length;
            
            activeCount.textContent = `${active} attiv${active === 1 ? 'o' : 'i'}`;
            completedCount.textContent = `${completed} completat${completed === 1 ? 'o' : 'i'}`;
            
            statsBar.style.opacity = items.length > 0 ? '1' : '0';
            
            if (completed > 0) {
                clearCompletedBtn.classList.remove('hidden');
            } else {
                clearCompletedBtn.classList.add('hidden');
            }
        }
        
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        function createItemElement(item, withAnimation = false) {
            const div = document.createElement('div');
            div.className = `list-item bg-white rounded-3xl p-4 shadow-sm border border-gray-50 flex items-center gap-4 ${item.completed ? 'item-completed' : ''} ${withAnimation ? 'item-enter' : ''}`;
            div.dataset.id = item.id;
            div.setAttribute('role', 'listitem');
            
            div.innerHTML = `
                <button 
                    class="checkbox-custom ${item.completed ? 'checked' : ''}" 
                    aria-label="${item.completed ? 'Segna come non completato' : 'Segna come completato'}"
                >
                    ${item.completed ? `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    ` : ''}
                </button>
                <span class="item-text flex-1 font-semibold text-gray-700 text-lg truncate">${escapeHTML(item.text)}</span>
                <button 
                    class="delete-btn w-8 h-8 rounded-full hover:bg-red-50 flex items-center justify-center text-gray-300 hover:text-red-400 transition-colors btn-press"
                    aria-label="Elimina ${escapeHTML(item.text)}"
                >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            `;
            
            // Event listeners
            const checkbox = div.querySelector('.checkbox-custom');
            checkbox.addEventListener('click', () => toggleItem(item.id));
            
            const deleteBtn = div.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', () => deleteItem(item.id));
            
            return div;
        }
        
        function renderList(animate = false) {
            const sorted = getSortedItems();
            
            itemsList.innerHTML = '';
            
            if (sorted.length === 0) {
                emptyState.style.display = 'flex';
            } else {
                emptyState.style.display = 'none';
                sorted.forEach((item, index) => {
                    const el = createItemElement(item, animate);
                    if (animate) {
                        el.style.animationDelay = `${index * 0.05}s`;
                    }
                    itemsList.appendChild(el);
                });
            }
            
            updateStats();
        }
        
        // ==================== ACTIONS ====================
        function addItem(text) {
            const trimmed = text.trim();
            if (!trimmed) return;
            
            const newItem = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                text: trimmed,
                completed: false,
                createdAt: Date.now()
            };
            
            items.unshift(newItem);
            saveItems();
            
            // Hide empty state
            emptyState.style.display = 'none';
            
            // Create and insert element with animation
            const el = createItemElement(newItem, true);
            
            // Insert at top (before first completed item if any)
            const firstCompleted = itemsList.querySelector('.item-completed');
            if (firstCompleted) {
                itemsList.insertBefore(el, firstCompleted);
            } else {
                itemsList.insertBefore(el, itemsList.firstChild);
            }
            
            updateStats();
        }
        
        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            
            const wasCompleted = item.completed;
            item.completed = !wasCompleted;
            
            if (!wasCompleted) {
                // Completing - add timestamp and trigger effects
                item.completedAt = Date.now();
                
                // Find the element and get position for emoji burst
                const itemEl = itemsList.querySelector(`[data-id="${id}"]`);
                if (itemEl) {
                    const rect = itemEl.getBoundingClientRect();
                    triggerEmojiBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
                    itemEl.classList.add('gnam-pop');
                }
            }
            
            saveItems();
            
            // Re-render after animation
            setTimeout(() => {
                renderList();
            }, 350);
        }
        
        function deleteItem(id) {
            const itemEl = itemsList.querySelector(`[data-id="${id}"]`);
            
            if (itemEl) {
                itemEl.classList.add('item-exit');
                setTimeout(() => {
                    items = items.filter(i => i.id !== id);
                    saveItems();
                    renderList();
                }, 300);
            } else {
                items = items.filter(i => i.id !== id);
                saveItems();
                renderList();
            }
        }
        
        function clearCompletedItems() {
            const completedEls = itemsList.querySelectorAll('.item-completed');
            
            completedEls.forEach((el, i) => {
                setTimeout(() => {
                    el.classList.add('item-exit');
                }, i * 50);
            });
            
            setTimeout(() => {
                items = items.filter(i => !i.completed);
                saveItems();
                renderList();
            }, completedEls.length * 50 + 300);
        }
        
        // ==================== EMOJI BURST ====================
        function triggerEmojiBurst(x, y) {
            const count = 5 + Math.floor(Math.random() * 4);
            
            for (let i = 0; i < count; i++) {
                const emoji = document.createElement('span');
                emoji.className = 'emoji-burst';
                emoji.textContent = foodEmojis[Math.floor(Math.random() * foodEmojis.length)];
                
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const distance = 60 + Math.random() * 80;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 30;
                const rot = (Math.random() - 0.5) * 360;
                
                emoji.style.left = x + 'px';
                emoji.style.top = y + 'px';
                emoji.style.setProperty('--tx', tx + 'px');
                emoji.style.setProperty('--ty', ty + 'px');
                emoji.style.setProperty('--rot', rot + 'deg');
                
                emojiContainer.appendChild(emoji);
                
                setTimeout(() => emoji.remove(), 1000);
            }
        }
        
        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize DOM references
            addForm = document.getElementById('addForm');
            itemInput = document.getElementById('itemInput');
            itemsList = document.getElementById('itemsList');
            emptyState = document.getElementById('emptyState');
            statsBar = document.getElementById('statsBar');
