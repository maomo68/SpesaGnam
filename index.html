<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpesaGnam Smart</title>
    
    <meta name="theme-color" content="#2ecc71">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" href="icona.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mint: { 100: '#e1f9eb', 400: '#3ecc7d', 500: '#2ecc71', 600: '#23a85a' },
                        sunset: { 500: '#e67e22' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Quicksand', sans-serif; background: #fefdfb; overflow-x: hidden; }
        .category-header { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; tracking: 0.05em; padding: 12px 16px 4px; color: #9ca3af; display: flex; align-items: center; gap: 6px; }
        .list-document { background: white; border-radius: 1.25rem; box-shadow: 0 4px 20px rgba(0,0,0,0.03); overflow: hidden; border: 1px solid #f0f0f0; }
        .list-row { display: flex; align-items: center; padding: 10px 16px; gap: 12px; border-bottom: 1px solid #f9fafb; transition: all 0.2s; }
        .item-completed .item-text { text-decoration: line-through; color: #d1d5db; }
        .item-completed { opacity: 0.7; background: #f9fafb; }
        
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #overlay { transition: opacity 0.3s; opacity: 0; pointer-events: none; }
        #overlay.open { opacity: 1; pointer-events: auto; }

        .checkbox-custom { width: 24px; height: 24px; border-radius: 8px; border: 2px solid #e5e7eb; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .checkbox-custom.checked { background: #2ecc71; border-color: #2ecc71; transform: scale(0.9); }
        
        .emoji-burst { position: fixed; pointer-events: none; font-size: 1.5rem; z-index: 100; animation: burst 0.8s forwards; }
        @keyframes burst { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot)); } }
        
        /* Progress Bar */
        #progressContainer { height: 4px; background: #f3f4f6; border-radius: 2px; overflow: hidden; margin-bottom: 12px; display: none; }
        #progressBar { height: 100%; background: #2ecc71; width: 0%; transition: width 0.4s ease; }
    </style>
</head>
<body class="bg-gradient-to-br from-white to-green-50 min-h-screen">

    <div id="overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40" onclick="toggleMenu()"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl z-50 flex flex-col p-6">
        <h2 class="text-xl font-800 text-mint-600 italic mb-8">I tuoi modelli</h2>
        <div id="templatesList" class="flex-1 space-y-3 overflow-y-auto"></div>
        <button onclick="saveCurrentAsTemplate()" class="mt-4 w-full py-3 bg-mint-500 text-white rounded-xl font-bold btn-press">Salva Lista Attuale</button>
    </aside>

    <div class="max-w-lg mx-auto px-4 py-4 min-h-screen flex flex-col">
        <header class="flex items-center justify-between mb-6">
            <button onclick="toggleMenu()" class="p-2.5 bg-white rounded-xl shadow-sm border border-gray-100 btn-press">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h1 class="text-2xl font-800 text-mint-600">Spesa<span class="text-sunset-500">Gnam</span></h1>
            <div class="w-10"></div>
        </header>

        <div class="sticky top-0 z-30 bg-transparent pb-4">
            <form id="addForm" class="relative">
                <input type="text" id="itemInput" placeholder="2 latte, mele, sapone..." class="w-full px-5 py-4 pr-14 text-base font-600 bg-white rounded-2xl border-none shadow-xl outline-none focus:ring-2 focus:ring-mint-400 transition-all">
                <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-mint-500 text-white rounded-xl flex items-center justify-center shadow-lg btn-press">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </form>
        </div>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <div id="statsBar" class="flex items-center justify-between mb-4 px-1 text-[11px] font-bold text-gray-400 uppercase tracking-wider" style="display: none;">
            <span id="activeCount">0 articoli</span>
            <div class="flex gap-4">
                <button onclick="shareWhatsApp()" class="text-mint-600">Condividi</button>
                <button id="clearCompleted" class="text-sunset-500">Pulisci</button>
            </div>
        </div>

        <div id="itemsList" class="flex-1 list-document" style="display: none;"></div>
        
        <div id="emptyState" class="flex-1 flex flex-col items-center justify-center py-12 opacity-40">
            <p class="font-800 text-gray-400">COSA MANGIAMO OGGI?</p>
        </div>
    </div>

    <div id="emojiContainer" class="fixed inset-0 pointer-events-none z-50"></div>

    <script>
        let items = [];
        let templates = [];

        // --- MOTORE CATEGORIE ---
        const categories = {
            "Ortofrutta": { icon: "🍎", color: "text-red-500", bg: "bg-red-50", keywords: ["mela", "mele", "banana", "pera", "insalata", "pomodor", "carot", "verdura", "frutta", "zucchina", "cipolla", "patat"] },
            "Latticini e Uova": { icon: "🥛", color: "text-blue-500", bg: "bg-blue-50", keywords: ["latte", "uova", "formaggio", "yogurt", "burro", "mozzarella", "stracchino", "parmigiano", "panna"] },
            "Carne e Pesce": { icon: "🍗", color: "text-orange-600", bg: "bg-orange-50", keywords: ["pollo", "carne", "manzo", "pesce", "tonno", "prosciutto", "salame", "salsiccia", "hamburger"] },
            "Forno": { icon: "🍞", color: "text-yellow-700", bg: "bg-yellow-50", keywords: ["pane", "focaccia", "biscotti", "crackers", "grissini", "torta", "cornetto"] },
            "Dispensa": { icon: "🍝", color: "text-amber-600", bg: "bg-amber-50", keywords: ["pasta", "riso", "farina", "zucchero", "sale", "olio", "caffè", "the", "sugo", "passata", "scatola"] },
            "Casa e Igiene": { icon: "🧼", color: "text-purple-500", bg: "bg-purple-50", keywords: ["sapone", "detersivo", "carta", "shampoo", "dentifricio", "candeggina", "ammorbidente"] },
            "Bevande": { icon: "🥤", color: "text-cyan-500", bg: "bg-cyan-50", keywords: ["acqua", "birra", "vino", "succo", "bibita", "cola"] }
        };

        function getCategory(text) {
            text = text.toLowerCase();
            for (let cat in categories) {
                if (categories[cat].keywords.some(k => text.includes(k))) return cat;
            }
            return "Altro";
        }

        // --- CORE FUNCTIONS ---
        function $(id) { return document.getElementById(id); }
        function save() { 
            localStorage.setItem('spesagnam_v3', JSON.stringify(items)); 
            localStorage.setItem('spesagnam_tpl_v3', JSON.stringify(templates));
        }

        function addItem(text) {
            if(!text) return;
            const qtyMatch = text.match(/^(\d+(?:[.,]\d+)?\s*(?:kg|g|l|ml|x|pz)?)\s+(.*)/i);
            const name = qtyMatch ? qtyMatch[2] : text;
            items.unshift({
                id: Date.now() + Math.random(),
                name: name,
                qty: qtyMatch ? qtyMatch[1] : null,
                category: getCategory(name),
                completed: false,
                createdAt: Date.now()
            });
            save(); render();
        }

        function render() {
            const list = $('itemsList');
            if(items.length === 0) {
                $('emptyState').style.display = 'flex';
                $('progressContainer').style.display = 'none';
                list.style.display = 'none';
                $('statsBar').style.display = 'none';
                return;
            }

            $('emptyState').style.display = 'none';
            $('statsBar').style.display = 'flex';
            $('progressContainer').style.display = 'block';
            list.style.display = 'block';

            // Stats e Progress
            const completedCount = items.filter(i => i.completed).length;
            const progress = (completedCount / items.length) * 100;
            $('progressBar').style.width = progress + "%";
            $('activeCount').innerText = `${items.length} articoli totali`;
            $('clearCompleted').style.display = completedCount > 0 ? 'block' : 'none';

            // Raggruppamento per Categoria
            const grouped = items.reduce((acc, item) => {
                if (!acc[item.category]) acc[item.category] = [];
                acc[item.category].push(item);
                return acc;
            }, {});

            let html = '';
            for (let cat in grouped) {
                const info = categories[cat] || { icon: "📦", color: "text-gray-400" };
                html += `<div class="category-header">${info.icon} ${cat}</div>`;
                grouped[cat].forEach(item => {
                    html += `
                        <div class="list-row ${item.completed ? 'item-completed' : ''}" data-id="${item.id}">
                            <div class="checkbox-custom ${item.completed ? 'checked' : ''}" role="checkbox">
                                ${item.completed ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
                            </div>
                            <div class="flex-1 flex items-center gap-2">
                                ${item.qty ? `<span class="px-2 py-0.5 rounded-md bg-gray-100 text-[10px] font-800 text-gray-500 uppercase">${item.qty}</span>` : ''}
                                <span class="item-text font-600 text-gray-700">${item.name}</span>
                            </div>
                            <button class="delete-btn opacity-20 hover:opacity-100 p-1 text-red-400">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            </button>
                        </div>
                    `;
                });
            }
            list.innerHTML = html;
        }

        // --- EVENTI ---
        document.addEventListener('DOMContentLoaded', () => {
            items = JSON.parse(localStorage.getItem('spesagnam_v3')) || [];
            templates = JSON.parse(localStorage.getItem('spesagnam_tpl_v3')) || [];
            render();
            
            $('addForm').addEventListener('submit', (e) => {
                e.preventDefault();
                addItem($('itemInput').value.trim());
                $('itemInput').value = '';
            });

            $('itemsList').addEventListener('click', (e) => {
                const row = e.target.closest('.list-row');
                if(!row) return;
                const id = row.dataset.id;
                
                if(e.target.closest('.checkbox-custom')) {
                    let item = items.find(i => i.id == id);
                    item.completed = !item.completed;
                    save(); render();
                }
                
                if(e.target.closest('.delete-btn')) {
                    items = items.filter(i => i.id != id);
                    save(); render();
                }
            });
        });

        function toggleMenu() {
            $('sidebar').classList.toggle('open');
            $('overlay').classList.toggle('open');
        }
    </script>
</body>
</html>
