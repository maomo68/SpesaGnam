<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpesaGnam Fun Edition</title>
    
    <meta name="theme-color" content="#2ecc71">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" href="icona.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mint: { 500: '#2ecc71', 600: '#27ae60' },
                        darkbg: '#1e2124', // Uno scuro ma non nero
                        cardbg: '#ffffff',
                        textmain: '#2d3436'
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Quicksand', sans-serif; background: #f0f2f5; color: #2d3436; }
        
        /* Liste e Categorie */
        .category-header { 
            font-size: 0.75rem; font-weight: 800; text-transform: uppercase; 
            padding: 16px 16px 8px; color: #636e72; display: flex; align-items: center; gap: 8px;
        }
        .list-document { 
            background: white; border-radius: 1.5rem; border: 2px solid #dfe6e9; 
            overflow: hidden; box-shadow: 0 8px 0px rgba(0,0,0,0.05);
        }
        .list-row { 
            display: flex; align-items: center; padding: 14px 16px; gap: 12px; 
            border-bottom: 2px solid #f1f2f6; transition: all 0.2s;
        }
        .item-completed { background: #f8f9fa; opacity: 0.6; }
        .item-completed .item-text { text-decoration: line-through; color: #b2bec3; }
        
        /* Sidebar */
        #sidebar { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1); transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }
        #overlay { transition: opacity 0.3s; opacity: 0; pointer-events: none; background: rgba(0,0,0,0.5); }
        #overlay.open { opacity: 1; pointer-events: auto; backdrop-filter: blur(4px); }

        /* Bottoni */
        .btn-fun { 
            transition: all 0.2s; border-bottom: 4px solid rgba(0,0,0,0.2); 
        }
        .btn-fun:active { transform: translateY(2px); border-bottom-width: 2px; }
        
        .checkbox-custom { 
            width: 28px; height: 28px; border-radius: 10px; border: 3px solid #dfe6e9; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        .checkbox-custom.checked { background: #2ecc71; border-color: #27ae60; }
        
        #progressBar { height: 8px; border-radius: 10px; background: #2ecc71; transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="min-h-screen">

    <div id="overlay" class="fixed inset-0 z-40" onclick="toggleMenu()"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-80 bg-white shadow-2xl z-50 flex flex-col p-8">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-800 text-textmain italic">Le tue liste 📂</h2>
            <button onclick="toggleMenu()" class="text-gray-400">✖</button>
        </div>
        <div id="templatesList" class="flex-1 space-y-4 overflow-y-auto font-bold text-gray-600">
            </div>
        <button onclick="saveCurrentAsTemplate()" class="mt-6 w-full py-4 bg-sunset-500 bg-orange-500 text-white rounded-2xl font-800 shadow-lg btn-fun">
            💾 Salva lista attuale
        </button>
    </aside>

    <div class="max-w-lg mx-auto px-5 py-6 flex flex-col min-h-screen">
        
        <header class="flex items-center justify-between mb-8">
            <button onclick="toggleMenu()" class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-md border-2 border-gray-100 btn-fun">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2d3436" stroke-width="3"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h1 class="text-3xl font-900 tracking-tighter text-mint-600">Spesa<span class="text-orange-500">Gnam!</span></h1>
            <div class="w-12"></div>
        </header>

        <div class="sticky top-0 z-30 pb-6">
            <form id="addForm" class="relative group">
                <input type="text" id="itemInput" placeholder="Cosa compriamo? 🍕" 
                    class="w-full px-6 py-5 pr-16 text-lg font-700 bg-white rounded-3xl border-3 border-gray-200 shadow-xl outline-none focus:border-mint-500 transition-all text-textmain">
                <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-mint-500 text-white rounded-2xl flex items-center justify-center shadow-lg btn-fun">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </form>
        </div>

        <div class="mb-6">
            <div class="flex justify-between text-[12px] font-800 text-gray-500 uppercase mb-2 px-1">
                <span>Progresso Spesa</span>
                <span id="progressText">0%</span>
            </div>
            <div class="h-4 bg-gray-200 rounded-full overflow-hidden border-2 border-white shadow-inner">
                <div id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <div id="statsBar" class="flex items-center justify-between mb-4 px-2" style="display: none;">
            <div class="flex gap-4">
                <button onclick="shareWhatsApp()" class="text-sm font-800 text-mint-600 bg-mint-50 px-4 py-2 rounded-xl btn-fun">📤 Condividi</button>
                <button id="clearCompleted" class="text-sm font-800 text-red-500 bg-red-50 px-4 py-2 rounded-xl btn-fun">🗑️ Pulisci</button>
            </div>
        </div>

        <div id="itemsList" class="flex-1 list-document" style="display: none;"></div>
        
        <div id="emptyState" class="flex-1 flex flex-col items-center justify-center py-20 text-center">
            <div class="text-6xl mb-4">🛒</div>
            <h2 class="text-xl font-900 text-gray-400">LISTA VUOTA</h2>
            <p class="text-gray-400 font-600">Aggiungi articoli per iniziare!</p>
        </div>
    </div>

    <div id="emojiContainer" class="fixed inset-0 pointer-events-none z-50"></div>

    <script>
        let items = [];
        let templates = [];

        const categories = {
            "Ortofrutta": { icon: "🍎", keywords: ["mela", "banana", "pera", "insalata", "pomodor", "carot", "zucchina", "cipolla", "patat", "limon", "frutta", "verdura"] },
            "Latticini": { icon: "🥛", keywords: ["latte", "uova", "formaggio", "yogurt", "burro", "mozzarella", "parmigiano", "panna"] },
            "Carne e Pesce": { icon: "🍗", keywords: ["pollo", "carne", "manzo", "pesce", "tonno", "prosciutto", "salame", "salsiccia", "hamburger"] },
            "Forno": { icon: "🍞", keywords: ["pane", "focaccia", "biscotti", "crackers", "torta", "cornetto"] },
            "Dispensa": { icon: "🍝", keywords: ["pasta", "riso", "farina", "zucchero", "sale", "olio", "caffè", "the", "sugo", "passata", "tonno"] },
            "Casa": { icon: "🧼", keywords: ["sapone", "detersivo", "carta", "shampoo", "dentifricio", "candeggina", "fazzoletti"] },
            "Bevande": { icon: "🥤", keywords: ["acqua", "birra", "vino", "succo", "bibita", "cola"] }
        };

        function $(id) { return document.getElementById(id); }

        function getCategory(text) {
            text = text.toLowerCase();
            for (let cat in categories) {
                if (categories[cat].keywords.some(k => text.includes(k))) return cat;
            }
            return "Altro";
        }

        function save() {
            localStorage.setItem('spesagnam_v4', JSON.stringify(items));
            localStorage.setItem('spesagnam_tpl_v4', JSON.stringify(templates));
        }

        function toggleMenu() {
            $('sidebar').classList.toggle('open');
            $('overlay').classList.toggle('open');
        }

        function addItem(text) {
            if(!text) return;
            const qtyMatch = text.match(/^(\d+(?:[.,]\d+)?\s*(?:kg|g|l|ml|x|pz)?)\s+(.*)/i);
            const name = qtyMatch ? qtyMatch[2] : text;
            items.unshift({
                id: Date.now() + Math.random(),
                name: name,
                qty: qtyMatch ? qtyMatch[1] : null,
                category: getCategory(name),
                completed: false
            });
            save(); render();
        }

        // --- FUNZIONI MODELLI ---
        function saveCurrentAsTemplate() {
            if (items.length === 0) return alert("Aggiungi prima qualcosa!");
            const name = prompt("Nome della lista? (es: Spesa Base)");
            if (name) {
                templates.push({ id: Date.now(), name: name, items: JSON.parse(JSON.stringify(items)) });
                save(); renderTemplates();
            }
        }

        function loadTemplate(id) {
            const tpl = templates.find(t => t.id === id);
            if (tpl && confirm(`Vuoi aggiungere gli articoli di "${tpl.name}"?`)) {
                tpl.items.forEach(i => {
                    items.push({ ...i, id: Date.now() + Math.random(), completed: false });
                });
                save(); render(); toggleMenu();
            }
        }

        function deleteTemplate(id, e) {
            e.stopPropagation();
            if(confirm("Eliminare modello?")) {
                templates = templates.filter(t => t.id !== id);
                save(); renderTemplates();
            }
        }

        function renderTemplates() {
            const container = $('templatesList');
            if (templates.length === 0) {
                container.innerHTML = '<p class="text-sm font-600 text-gray-400 italic">Nessun modello salvato.</p>';
                return;
            }
            container.innerHTML = templates.map(t => `
                <div onclick="loadTemplate(${t.id})" class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border-2 border-gray-100 cursor-pointer hover:bg-mint-50 transition-all">
                    <span>${t.name}</span>
                    <button onclick="deleteTemplate(${t.id}, event)" class="text-red-300 hover:text-red-500 text-xl">×</button>
                </div>
            `).join('');
        }

        function render() {
            const list = $('itemsList');
            if(items.length === 0) {
                $('emptyState').style.display = 'flex';
                $('statsBar').style.display = 'none';
                list.style.display = 'none';
                $('progressBar').style.width = "0%";
                return;
            }

            $('emptyState').style.display = 'none';
            $('statsBar').style.display = 'flex';
            list.style.display = 'block';

            const completed = items.filter(i => i.completed).length;
            const perc = Math.round((completed / items.length) * 100);
            $('progressBar').style.width = perc + "%";
            $('progressText').innerText = perc + "%";

            const grouped = items.reduce((acc, item) => {
                if (!acc[item.category]) acc[item.category] = [];
                acc[item.category].push(item);
                return acc;
            }, {});

            let html = '';
            for (let cat in grouped) {
                const icon = categories[cat] ? categories[cat].icon : "📦";
                html += `<div class="category-header">${icon} ${cat}</div>`;
                grouped[cat].forEach(item => {
                    html += `
                        <div class="list-row ${item.completed ? 'item-completed' : ''}" data-id="${item.id}">
                            <div class="checkbox-custom ${item.completed ? 'checked' : ''}">
                                ${item.completed ? '✔' : ''}
                            </div>
                            <div class="flex-1 flex items-center gap-2">
                                ${item.qty ? `<span class="px-2 py-0.5 rounded-lg bg-gray-100 text-[10px] font-900 text-gray-600 uppercase">${item.qty}</span>` : ''}
                                <span class="item-text font-700 text-textmain">${item.name}</span>
                            </div>
                            <button class="delete-btn p-2 text-gray-300 hover:text-red-500 text-xl">×</button>
                        </div>
                    `;
                });
            }
            list.innerHTML = html;
        }

        function shareWhatsApp() {
            const active = items.filter(i => !i.completed);
            if(active.length === 0) return alert('Nulla da condividere!');
            let txt = "🛒 *SPESA SPESAGNAM:* \n" + active.map(i => `• ${i.qty ? `*${i.qty}* ` : ''}${i.name}`).join('\n');
            window.open(`whatsapp://send?text=${encodeURIComponent(txt)}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', () => {
            items = JSON.parse(localStorage.getItem('spesagnam_v4')) || [];
            templates = JSON.parse(localStorage.getItem('spesagnam_tpl_v4')) || [];
            
            render();
            renderTemplates();

            $('addForm').addEventListener('submit', (e) => {
                e.preventDefault();
                addItem($('itemInput').value.trim());
                $('itemInput').value = '';
            });

            $('itemsList').addEventListener('click', (e) => {
                const row = e.target.closest('.list-row');
                if(!row) return;
                const id = row.dataset.id;
                
                if(e.target.closest('.checkbox-custom')) {
                    let item = items.find(i => i.id == id);
                    item.completed = !item.completed;
                    save(); render();
                }
                
                if(e.target.closest('.delete-btn')) {
                    items = items.filter(i => i.id != id);
                    save(); render();
                }
            });

            $('clearCompleted').addEventListener('click', () => {
                if(confirm("Eliminare articoli completati?")) {
                    items = items.filter(i => !i.completed);
                    save(); render();
                }
            });
        });
    </script>
</body>
</html>
